name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: pip install "ruff==0.14.14"

      - name: Ruff check
        run: ruff check netbox_backup_ops/

      - name: Ruff format
        run: ruff format --check netbox_backup_ops/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: netbox
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            plugin/pyproject.toml

      - name: Clone NetBox
        run: git clone --depth 1 --branch v4.5.0 https://github.com/netbox-community/netbox.git

      - name: Install NetBox + plugin
        run: |
          python -m pip install --upgrade pip
          pip install -r netbox/requirements.txt
          pip install -e ./plugin --no-deps

      - name: Configure NetBox
        run: cp plugin/testing/configuration.py netbox/netbox/netbox/configuration.py

      - name: Migrate / check migrations / collectstatic / test
        working-directory: netbox/netbox
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: netbox
          DB_USER: netbox
          DB_PASSWORD: netbox
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          python manage.py migrate --no-input
          python manage.py makemigrations --check netbox_backup_ops
          python manage.py collectstatic --no-input
          python manage.py test netbox_backup_ops.tests --parallel --keepdb -v 2
